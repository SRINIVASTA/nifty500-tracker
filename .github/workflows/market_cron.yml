name: Scheduled Market Data Pipeline

on:
  schedule:
    - cron: "30 11 * * 1-5" # Runs Monday to Friday at 11:30 UTC (5:00 PM IST)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install toml

      - name: Run headless ingestion & email dispatch
        env:
          PYTHONPATH: .
          USERNAME: ${{ secrets.USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python cron_job.py
