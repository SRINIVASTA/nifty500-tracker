name: Scheduled Market Data Pipeline

on:
  schedule:
    # Trigger at 1:15 PM UTC, which corresponds exactly to 6:45 PM IST
    - cron: '15 13 * * 1-5'
  workflow_dispatch: # Keeps your manual "Run workflow" button active

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install toml

    - name: Execute Ingestion Engine
      run: python cron_job.py
